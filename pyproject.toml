[project]
name = "phenomica"
version = "0.1.0"
description = "Vision model distillation from DINOv2"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=1.0",
    "hydra-core>=1.3",
    "hydra-zen>=0.13",
    "hydra-submitit-launcher>=1.2",
    "pydantic>=2",
    "wandb>=0.17",
    "scikit-learn>=1.3",
    "submitit>=1.5",
    "tqdm>=4.64",
]

[project.optional-dependencies]
rxrx = [
    "rxrx-map-tractor",
    "rxrx-map-benchmarking",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
phenomica-train = "phenomica.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phenomica"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
